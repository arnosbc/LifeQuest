<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Questly · Hoy</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#18181B;--mute:#71717A;--line:#E4E4E7;--purple:#B81E9A;--yellow:#F2C94C;--brown:#C8A27A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff;color:var(--ink);font-family:Inter,sans-serif}
.screen{position:relative;width:390px;height:844px}
.contours{position:absolute;inset:0;pointer-events:none;opacity:.35}
.num{font-family:"Barlow Semi Condensed",sans-serif}
header{padding:44px 20px 12px;position:relative}
header h1{font-size:28px;font-weight:600;letter-spacing:-.01em}
header p{font-size:14px;color:var(--mute);margin-top:4px}
header p b{color:var(--ink);font-weight:600}
.course{position:relative;margin:12px 16px 0;padding-left:56px}
.row{position:relative;display:grid;grid-template-columns:52px 1fr auto;align-items:center;min-height:64px;border-bottom:1px solid var(--line);font-size:16px}
.row .t{font-family:"Barlow Semi Condensed";font-size:18px;font-weight:600;color:var(--mute)}
.row .d{font-family:"Barlow Semi Condensed";font-size:16px;font-weight:500;color:var(--mute);padding-right:4px}
.done .n{color:var(--mute);text-decoration:line-through}
.ctrl{position:absolute;left:-46px;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:17px}
.done .ctrl{border-color:#A1A1AA;color:#A1A1AA}
.active .ctrl{border-color:var(--purple);color:var(--purple);border-width:3px}
.active{min-height:132px;align-items:start;padding-top:18px}
.active .t,.active .n{color:var(--ink)}.active .n{font-weight:600}
.active .ctrl{top:36px}
.go{grid-column:2/4;margin-top:12px;height:48px;border:0;border-radius:24px;background:var(--purple);color:#fff;font:600 15px Inter;display:flex;align-items:center;justify-content:center;gap:8px;width:180px}
.leg{position:absolute;left:-30px;width:2px;background:#A1A1AA}
.free{position:relative;margin:0 0 0 -56px;height:44px;display:flex;align-items:center;padding-left:108px;background:repeating-linear-gradient(0deg,rgba(242,201,76,.35),rgba(242,201,76,.35));border-left:4px solid var(--yellow);font-size:14px;font-weight:500}
.free .t{position:absolute;left:56px;font-family:"Barlow Semi Condensed";font-weight:600;font-size:16px;color:#8A6D10}
.check{width:20px;height:20px}
.capture{position:absolute;left:16px;right:16px;bottom:96px;height:56px;border:1.5px solid var(--ink);border-radius:28px;display:flex;align-items:center;padding:0 8px 0 20px;font-size:16px;color:var(--mute);background:#fff}
.capture .mic{margin-left:auto;width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center}
nav{position:absolute;left:0;right:0;bottom:0;height:80px;border-top:1px solid var(--line);display:flex;background:#fff}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--mute);text-decoration:none}
nav .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
nav a.on{color:var(--ink);font-weight:600}nav a.on .pill{background:#F4E1EF}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
</style></head>
<body><div class="screen">
<svg class="contours" viewBox="0 0 390 844" aria-hidden="true">
 <g fill="none" stroke="var(--brown)" stroke-width=".8">
  <path d="M300 0c10 40 60 60 90 55"/><path d="M270 0c15 60 80 90 120 82"/><path d="M245 0c20 80 100 120 145 110"/>
  <path d="M0 560c40 10 60 60 40 110"/><path d="M0 530c60 15 90 80 62 150"/><path d="M0 500c80 20 120 100 85 190"/>
 </g></svg>
<header>
 <h1>Viernes <span class="num">31</span> oct</h1>
 <p>Recorrido de hoy · <b class="num">4</b> controles · <b class="num">1</b> hecho</p>
</header>
<section class="course" aria-label="Recorrido de hoy">
 <div class="leg" style="top:32px;height:74px;background:var(--purple);width:5px;left:-31.5px"></div>
 <div class="leg" style="top:166px;height:180px"></div>
 <div class="leg" style="top:346px;height:64px"></div>
 <div class="row done"><span class="ctrl">1</span><span class="t">14:00</span><span class="n">Revisar informe de ventas</span>
  <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2.5" aria-label="Hecho"><path d="M5 12l5 5L20 7"/></svg></div>
 <div class="row active"><span class="ctrl">2</span><span class="t">16:00</span><span class="n">Llamar a mamá</span><span class="d">30 min</span>
  <button class="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>Empezar foco</button></div>
 <div class="free"><span class="t">17:00</span>Hueco libre <span class="num" style="margin-left:6px;font-weight:600">1 h 30</span></div>
 <div class="row"><span class="ctrl">3</span><span class="t">18:30</span><span class="n">Gimnasio</span><span class="d">60 min</span></div>
 <div class="row"><span class="ctrl">4</span><span class="t">20:00</span><span class="n">Leer</span><span class="d">20 min</span></div>
</section>
<div class="capture">Escribe o dicta…<span class="mic" aria-label="Dictar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></span></div>
<nav>
 <a class="on" href="#"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>Hoy</a>
 <a href="#"><span class="pill"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></span>Tareas</a>
 <a href="#"><span class="pill"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/></svg></span>Hábitos</a>
 <a href="#"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2 2M10 3h4"/></svg></span>Foco</a>
 <a href="#"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>Tú</a>
</nav>
</div></body></html>
