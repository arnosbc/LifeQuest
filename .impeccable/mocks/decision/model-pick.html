<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Questly Hoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ground:#F1EFEA;--sheet:#FFFFFF;--ink:#111111;--muted:#6B6862;--line:#E4E1DA;--red:#D7262E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);font-family:"Archivo",sans-serif;color:var(--ink)}
.status{height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:13px;font-weight:600}
.pad{position:relative;margin:8px 16px 0;height:690px}
.binding{height:22px;background:#2A2A2A;border-radius:4px 4px 0 0;position:relative;z-index:3}
.stub{position:absolute;left:0;right:0;height:12px;background:var(--sheet);opacity:.75;z-index:2;
 clip-path:polygon(0 0,100% 0,100% 55%,96% 100%,91% 50%,86% 90%,80% 45%,74% 100%,68% 55%,62% 95%,56% 40%,50% 85%,44% 50%,38% 100%,32% 45%,26% 90%,20% 55%,14% 100%,8% 50%,3% 85%,0 60%)}
.s1{top:22px}.s2{top:22px;height:8px;opacity:.55;transform:scaleX(-1)}
.sheet{position:absolute;top:36px;left:0;right:0;bottom:0;background:var(--sheet);padding:22px 20px 16px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(17,17,17,.06);
 clip-path:polygon(0 8px,4% 2px,9% 7px,14% 0,20% 6px,25% 2px,31% 8px,37% 1px,43% 6px,49% 0,55% 7px,61% 2px,67% 8px,73% 1px,79% 6px,85% 0,91% 7px,96% 2px,100% 6px,100% 100%,0 100%)}
.day{text-align:center;padding-top:6px}
.num{font-weight:900;font-size:184px;line-height:.82;letter-spacing:-8px;color:var(--red)}
.wd{margin-top:14px;font-size:18px;font-weight:600}
.meta{margin-top:6px;font-size:14px;color:var(--muted)}
.rule{border:0;border-top:1px dashed var(--line);margin:22px 0 6px}
ul{list-style:none}
li{display:flex;align-items:center;gap:14px;min-height:64px;border-bottom:1px solid var(--line);position:relative}
li:last-child{border-bottom:0}
.check{width:48px;height:48px;flex:none;display:grid;place-items:center;background:none;border:0;margin-left:-8px}
.check span{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink)}
.done .check span{background:var(--ink);position:relative}
.done .check span::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.t{font-size:13px;font-weight:600;color:var(--muted);width:44px;flex:none;font-variant-numeric:tabular-nums}
.n{font-size:16px;font-weight:500;flex:1}
.done .n{text-decoration:line-through;color:var(--muted)}
.cur::before{content:"";position:absolute;left:-20px;top:10px;bottom:10px;width:4px;background:var(--red)}
.cur .t{color:var(--red)}
.cur .n{font-weight:700}
.cur{flex-wrap:wrap;padding:8px 0 12px}
.go{margin-left:92px;min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--ink);color:#fff;font:600 15px "Archivo",sans-serif}
.fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:16px;border:0;background:var(--ink);color:#fff;font:400 30px/1 "Archivo",sans-serif;z-index:5}
nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--ground);border-top:1px solid var(--line);display:flex}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:48px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500}
nav a i{width:22px;height:22px;border:2px solid currentColor;border-radius:6px}
nav a:nth-child(3) i{border-radius:50%}
nav a:nth-child(5) i{border-radius:50% 50% 6px 6px}
nav a[aria-current]{color:var(--ink);font-weight:800}
nav a[aria-current] i{background:var(--ink)}
</style>
</head>
<body>
<div class="status"><span>16:20</span><span>5G 82%</span></div>
<main class="pad">
 <div class="binding" aria-hidden="true"></div>
 <div class="stub s1" aria-hidden="true"></div>
 <div class="stub s2" aria-hidden="true"></div>
 <section class="sheet" aria-label="Hoy, viernes 31 de octubre">
  <div class="day">
   <div class="num">31</div>
   <p class="wd">viernes · octubre 2026</p>
   <p class="meta">3 pendientes · racha 12 días</p>
  </div>
  <hr class="rule">
  <ul>
   <li class="done"><button class="check" aria-label="Desmarcar Revisar informe de ventas"><span></span></button><span class="t">14:00</span><span class="n">Revisar informe de ventas</span></li>
   <li class="cur"><button class="check" aria-label="Completar Llamar a mamá"><span></span></button><span class="t">16:30</span><span class="n">Llamar a mamá</span><button class="go">Empezar foco</button></li>
   <li><button class="check" aria-label="Completar Gimnasio"><span></span></button><span class="t">18:30</span><span class="n">Gimnasio</span></li>
   <li><button class="check" aria-label="Completar Leer 20 min"><span></span></button><span class="t">20:00</span><span class="n">Leer 20 min</span></li>
  </ul>
 </section>
</main>
<button class="fab" aria-label="Añadir">+</button>
<nav aria-label="Navegación principal">
 <a href="#" aria-current="page"><i></i>Hoy</a>
 <a href="#"><i></i>Tareas</a>
 <a href="#"><i></i>Hábitos</a>
 <a href="#"><i></i>Foco</a>
 <a href="#"><i></i>Tú</a>
</nav>
</body>
</html>
