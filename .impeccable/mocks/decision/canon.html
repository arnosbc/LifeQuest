<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Questly Hoy</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#111827;--mute:#6B7280;--line:#E5E7EB;--blue:#2563EB;--blue-soft:#EFF4FF;--red:#B91C1C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Roboto,sans-serif}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:500}
header{padding:8px 16px 16px;display:flex;align-items:flex-end;justify-content:space-between}
h1{font-size:28px;font-weight:500;line-height:36px}
.sub{font-size:14px;color:var(--mute);margin-top:2px}
.icon-btn{width:48px;height:48px;border-radius:24px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
h2{font-size:14px;font-weight:500;color:var(--mute);padding:16px 16px 4px;letter-spacing:.1px}
ul{list-style:none}
li{display:flex;align-items:center;min-height:64px;padding:0 16px 0 4px;border-bottom:1px solid var(--line)}
.check{width:48px;height:48px;flex:none;display:grid;place-items:center;border:0;background:none}
.check span{width:22px;height:22px;border-radius:50%;border:2px solid #9CA3AF;display:grid;place-items:center}
.check.hi span{border-color:var(--red)}
.check.done span{background:var(--blue);border-color:var(--blue)}
.body{flex:1;padding:10px 0}
.title{font-size:16px;line-height:24px}
.done-t .title{text-decoration:line-through;color:var(--mute)}
.meta{display:flex;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:8px;background:#F3F4F6;font-size:12px;font-weight:500;color:#374151}
.chip.alta{background:#FEF2F2;color:var(--red)}
.chip svg{width:12px;height:12px}
.fab{position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:16px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(37,99,235,.3)}
nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:#F9FAFB;border-top:1px solid var(--line);display:flex}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--mute);text-decoration:none;min-height:48px}
nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
nav a.on{color:var(--ink)}
nav a.on .pill{background:var(--blue-soft);color:var(--blue)}
nav svg{width:24px;height:24px}
</style>
</head>
<body>
<div class="status"><span>9:41</span><span>5G 100%</span></div>
<header>
  <div><h1>Hoy</h1><p class="sub">vie 31 oct · 3 pendientes</p></div>
  <button class="icon-btn" aria-label="Buscar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</header>
<main>
<ul>
  <li class="done-t"><button class="check done" aria-label="Marcar como pendiente"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4"><path d="m5 12 5 5 9-10"/></svg></span></button>
    <div class="body"><p class="title">Revisar informe de ventas</p></div></li>
  <li><button class="check hi" aria-label="Completar Llamar a mamá"><span></span></button>
    <div class="body"><p class="title">Llamar a mamá</p>
      <div class="meta"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>16:00</span>
      <span class="chip alta"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h2v18H5zM8 4h11l-3 4 3 4H8z"/></svg>Alta</span></div></div></li>
  <li><button class="check" aria-label="Completar Gimnasio"><span></span></button>
    <div class="body"><p class="title">Gimnasio</p>
      <div class="meta"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>18:30</span></div></div></li>
  <li><button class="check" aria-label="Completar Leer 20 min"><span></span></button>
    <div class="body"><p class="title">Leer 20 min</p>
      <div class="meta"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>20:00</span></div></div></li>
</ul>
<h2>Mañana</h2>
<ul>
  <li><button class="check" aria-label="Completar Pagar internet"><span></span></button>
    <div class="body"><p class="title">Pagar internet</p></div></li>
</ul>
</main>
<button class="fab" aria-label="Nueva tarea"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
<nav aria-label="Navegación principal">
  <a class="on" href="#" aria-current="page"><span class="pill"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h14a1 1 0 0 1 1 1v15H4V5a1 1 0 0 1 1-1zm1 5v9h12V9z"/></svg></span>Hoy</a>
  <a href="#"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></span>Tareas</a>
  <a href="#"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 8-8"/><path d="M4 4v4h4"/></svg></span>Hábitos</a>
  <a href="#"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></svg></span>Foco</a>
  <a href="#"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Tú</a>
</nav>
</body>
</html>
