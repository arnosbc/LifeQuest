<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diario — Bitácora</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./questly.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=DM+Mono:wght@500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div data-mode="{{qMode}}" data-theme="{{qTheme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F6EF; color: #1E2A22; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden;">
  <main style="flex-grow: 1; overflow-y: auto; padding: 0 0 28px; display: flex; flex-direction: column;">
    <dc-import name="Hero" tone="{{qTone}}" kicker="Diario" heading="Bitácora" icon="book" back-href="Perfil.dc.html" back-label="Volver al perfil" hint-size="390px,156px"></dc-import>
    <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 16px;">

    <section aria-labelledby="wk-title" style="background: #1E2A22; color: #F3F6EF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 id="wk-title" style="margin: 0; font-size: 14px; font-weight: 700;">Tu semana</h2>
        <span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #9FDCB4;">+420 XP</span>
      </div>
      <div role="img" aria-label="XP por día: lunes 40, martes 75, miércoles 30, jueves 90, viernes 75, sábado 55, domingo 55" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 72px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
          <div aria-hidden="true" style="display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end;">
            <span style="width: 100%; height: {{b.h}}px; border-radius: 6px 6px 3px 3px; background: {{b.bg}};"></span>
            <span style="font-size: 11px; color: {{b.fg}}; font-weight: {{b.w}};">{{b.d}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 14px; font-size: 13px; color: #CFDACF;"><span><strong style="color: #F3F6EF;">18</strong> misiones</span><span><strong style="color: #F3F6EF;">4</strong> mazmorras</span><span><strong style="color: #F2B8A8;">2</strong> fallos</span><a href="Estadisticas.dc.html" style="margin-left: auto; color: #9FDCB4; font-weight: 700; min-height: 44px;; display: inline-flex; align-items: center">Ver estadísticas</a></div>
    </section>

    <div role="group" aria-label="Filtrar por apartado" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="flex-shrink: 0; min-height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 13px; font-weight: 700; cursor: pointer;">{{f.label}}</button>
      </sc-for>
    </div>

    <sc-for list="{{days}}" as="day" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 4px 0 0; font-size: 12px; font-weight: 700; color: #4E5C52; text-transform: uppercase; letter-spacing: 0.06em;">{{day.name}}</h2>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;">
          <sc-for list="{{day.items}}" as="e" hint-placeholder-count="3">
            <li style="display: flex; gap: 12px; padding: 12px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px #DCE4D4;">
              <span style="width: 32px; height: 32px; border-radius: 10px; background: {{e.iconBg}}; color: {{e.iconFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <sc-if value="{{e.ok}}" hint-placeholder-val="{{ true }}"><svg role="img" aria-label="Completada" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
                <sc-if value="{{e.fail}}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Fallada" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
              </span>
              <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 14px; line-height: 1.4;">{{e.msg}}</span>
                <span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #4E5C52;">
                  <span style="font-family: 'DM Mono', monospace;">{{e.time}}</span>
                  <span style="padding: 1px 8px; border-radius: 99px; background: {{e.originBg}}; color: {{e.originFg}}; font-weight: 700;">{{e.origin}}</span>
                </span>
              </div>
              <span style="font-family: 'DM Mono', monospace; font-size: 12px; color: {{e.rewardFg}}; white-space: nowrap; padding-top: 2px;">{{e.reward}}</span>
            </li>
          </sc-for>
        </ul>
      </div>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 8px 0; text-align: center; font-size: 14px; color: #4E5C52;">No hay registros de este apartado en los últimos dos días.</p>
    </sc-if>
    </div>
  </main>

  <nav aria-label="Principal" style="flex-shrink: 0; display: flex; background: #FFFFFF; border-top: 1px solid #DCE4D4; padding: 4px 4px 10px;">
    <a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4E5C52; font-size: 12px;"><span style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Inicio</a>
    <a href="Stage.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4E5C52; font-size: 12px;"><span style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></span>Stage</a>
    <a href="Habitos.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4E5C52; font-size: 12px;"><span style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"></path></svg></span>Hábitos</a>
    <a href="Mazmorra.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4E5C52; font-size: 12px;"><span style="width: 44px; height: 28px; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"></path></svg></span>Mazmorra</a>
    <a href="Perfil.dc.html" aria-current="page" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #1F5C39; font-size: 12px; font-weight: 700;"><span style="width: 44px; height: 28px; border-radius: 99px; background: #E1F0E6; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Perfil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'Todo' }; }
  componentDidMount() { this._qs = () => this.forceUpdate(); try { window.addEventListener('storage', this._qs); } catch (e) {} }
  qt() {
    let m = this.props.mode, t = this.props.theme;
    try { m = m || localStorage.getItem('questly-mode'); t = t || localStorage.getItem('questly-theme'); } catch (e) {}
    let dark = m === 'oscuro';
    if (m === 'auto') { try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} }
    t = ['bosque', 'rio', 'brasa', 'oro'].indexOf(t) >= 0 ? t : 'bosque';
    const tones = { bosque: 'forest', rio: 'river', brasa: 'ember', oro: 'gold' };
    return { qMode: dark ? 'dark' : 'light', qTheme: t, qTone: dark ? 'night' : tones[t] };
  }
  renderVals() { return { ...this.qt(), ...this.rv() }; }
  rv() {
    const s = this.state;
    const week = [['L', 40], ['M', 75], ['X', 30], ['J', 90], ['V', 75], ['S', 55], ['D', 55]];
    const bars = week.map(([d, v], i) => ({ d, h: Math.round(v / 90 * 52), bg: i === 6 ? '#9FDCB4' : '#3F9563', fg: i === 6 ? '#FFFFFF' : '#CFDACF', w: i === 6 ? 700 : 400 }));
    const origins = {
      'Tarea': ['#E1F0E6', '#1F5C39'], 'Mazmorra': ['#1E2A22', '#F3F6EF'], 'Hábito bueno': ['#E1F0E6', '#1F5C39'],
      'Hábito malo': ['#FBE4DF', '#A8361F'], 'Proyecto': ['#E3E9F7', '#2C4580'], 'Meta S.M.A.R.T.': ['#FBF0D3', '#6E4D00']
    };
    const log = [
      { day: 'Hoy', time: '18:42', ok: true, msg: 'Completaste «Repasar 20 palabras de inglés»', origin: 'Tarea', kind: 'Tareas', reward: '+15 XP' },
      { day: 'Hoy', time: '17:10', ok: true, msg: 'Venciste la Mazmorra 3 · Escribir la introducción', origin: 'Mazmorra', kind: 'Mazmorras', reward: '+25 XP' },
      { day: 'Hoy', time: '08:05', ok: true, msg: 'Completaste el hábito «Leer 20 minutos»', origin: 'Hábito bueno', kind: 'Hábitos', reward: '+10 XP' },
      { day: 'Hoy', time: '07:30', ok: false, msg: 'Registraste «Posponer la alarma»', origin: 'Hábito malo', kind: 'Hábitos', reward: '−5 HP' },
      { day: 'Ayer', time: '23:59', ok: false, msg: 'Se venció «Subir avance al repositorio»', origin: 'Proyecto', kind: 'Tareas', reward: '−5 HP' },
      { day: 'Ayer', time: '16:20', ok: true, msg: 'Golpeaste al Boss: hito «Primer borrador»', origin: 'Meta S.M.A.R.T.', kind: 'Metas', reward: '+60 XP' },
      { day: 'Ayer', time: '09:00', ok: true, msg: 'Completaste el hábito «Ejercicio»', origin: 'Hábito bueno', kind: 'Hábitos', reward: '+15 XP' }
    ];
    const filters = ['Todo', 'Tareas', 'Hábitos', 'Mazmorras', 'Metas'].map(k => {
      const on = s.filter === k;
      return { label: k, pressed: on ? 'true' : 'false', bg: on ? '#1E2A22' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1E2A22', border: on ? '#1E2A22' : '#C9D3C2', pick: () => this.setState({ filter: k }) };
    });
    const shown = log.filter(e => s.filter === 'Todo' || e.kind === s.filter).map(e => ({
      ...e, fail: !e.ok, iconBg: e.ok ? '#E1F0E6' : '#FBE4DF', iconFg: e.ok ? '#1F5C39' : '#A8361F',
      rewardFg: e.ok ? '#1F5C39' : '#A8361F', originBg: origins[e.origin][0], originFg: origins[e.origin][1]
    }));
    const days = ['Hoy', 'Ayer'].map(name => ({ name, items: shown.filter(e => e.day === name) })).filter(d => d.items.length);
    return { bars, filters, days, empty: days.length === 0 };
  }
}
</script>
</body>
</html>
